<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d3557"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Rutina Gym</title>

<style>
/* Layout: una columna tipo app de bolsillo; barra de días fija arriba, temporizador de descanso fijo abajo. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#152033; --muted:#5d6878; --line:#dfe4eb;
  --accent:#d9480f; --accent-soft:#fdeee6; --navy:#1d3557; --navy-ink:#ffffff;
  --pf:#0f766e; --pf-soft:#e3f4f1; --fig:#22314a; --ghost:#8a97aa; --equip:#9aa6b6; --figbg:#eef2f7; --ok:#2b8a3e; --ok-soft:#e6f4ea;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141d; --surface:#17202c; --ink:#e8edf4; --muted:#9aa6b6; --line:#273343;
  --accent:#ff7a3d; --accent-soft:#3a2216; --navy:#2c4a75; --navy-ink:#ffffff;
  --pf:#3cc5b4; --pf-soft:#123430; --fig:#dde5ef; --ghost:#7d8a9c; --equip:#566476; --figbg:#111a25; --ok:#5ccc75; --ok-soft:#173322; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141d; --surface:#17202c; --ink:#e8edf4; --muted:#9aa6b6; --line:#273343;
  --accent:#ff7a3d; --accent-soft:#3a2216; --navy:#2c4a75; --navy-ink:#ffffff;
  --pf:#3cc5b4; --pf-soft:#123430; --fig:#dde5ef; --ghost:#7d8a9c; --equip:#566476; --figbg:#111a25; --ok:#5ccc75; --ok-soft:#173322; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
header.top{padding-top:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:.2px;text-wrap:balance}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.sync{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
nav.days{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:12px 0 0;padding:8px 0;display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
nav.days button{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 0 6px;cursor:pointer;position:relative}
nav.days button b{display:block;font-family:var(--display);font-size:17px;line-height:1}
nav.days button span{font-size:10px;color:var(--muted);letter-spacing:.04em}
nav.days button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
nav.days button[aria-pressed="true"] span{color:var(--navy-ink);opacity:.8}
nav.days button.today::after{content:"";position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dayhead{margin:14px 0 10px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-size:32px;line-height:1.05;margin:2px 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.datebar{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.datebar input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card.pf{border-color:color-mix(in srgb,var(--pf) 45%,var(--line));background:var(--pf-soft)}
.card.block{border-left:4px solid var(--accent)}
.chead{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 12px 8px;align-items:start}
.num{width:34px;height:34px;border-radius:9px;background:var(--navy);color:var(--navy-ink);display:grid;place-items:center;font-family:var(--display);font-size:20px;font-weight:700}
.card.pf .num{background:var(--pf)}
.cname{font-weight:700;font-size:16px;line-height:1.2;min-width:0}
.dose{font-size:14px;margin-top:2px}
.dose .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--pf);margin-left:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--bg);color:var(--muted);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.up{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.start{background:var(--accent-soft);color:var(--accent);border-color:transparent}
details.how{border-top:1px solid var(--line)}
details.how summary{cursor:pointer;list-style:none;padding:8px 12px;font-size:13px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between}
:root[data-theme="dark"] details.how summary{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) details.how summary{color:var(--ink)}}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:"+";font-size:16px;line-height:1}
details.how[open] summary::after{content:"–"}
.howbody{padding:0 12px 12px;font-size:14px}
.howbody ol{margin:0 0 8px;padding-left:20px;display:grid;gap:3px}
.err{font-size:13px;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:6px 9px;margin-bottom:8px}
.err b{color:var(--accent)}
.vid{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:4px 12px}
.sets{border-top:1px solid var(--line);padding:8px 12px 12px;display:grid;gap:6px}
.card.pf .sets,.card.pf details.how{border-color:color-mix(in srgb,var(--pf) 30%,var(--line))}
.setrow{display:grid;grid-template-columns:52px 1fr 1fr 44px;gap:6px;align-items:center}
.setrow.one{grid-template-columns:52px 1fr 44px}
.setrow label{font-size:12px;color:var(--muted);font-weight:600}
.field{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:0 8px;min-width:0}
.field input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:600 16px var(--body);padding:8px 0;font-variant-numeric:tabular-nums}
.field input:focus{outline:none}
.field:focus-within{border-color:var(--accent)}
.field em{font-style:normal;font-size:12px;color:var(--muted);margin-left:4px}
.tick{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:18px;cursor:pointer}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.donebtn{justify-self:start;font:700 14px var(--body);padding:8px 14px;border-radius:9px;border:1px solid var(--pf);background:transparent;color:var(--pf);cursor:pointer}
.donebtn[aria-pressed="true"]{background:var(--pf);color:#fff}
.blockbody{padding:12px;display:grid;gap:8px;font-size:14px}
.blockbody h3{margin:0;font-family:var(--display);font-size:21px}
.steps{margin:0;padding-left:18px;display:grid;gap:3px}
.ridegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ridegrid .wide{grid-column:1/-1}
.ridegrid label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.ridegrid select{font:600 15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px}
.calc{font-size:13px;color:var(--muted)}
.calc b{color:var(--ink);font-variant-numeric:tabular-nums}
.primary{font:700 16px var(--body);width:100%;padding:13px;border-radius:12px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.primary:disabled{opacity:.55;cursor:default}
.secondary{font:700 14px var(--body);padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.savebar{margin:14px 0 4px;display:grid;gap:6px}
.status{font-size:13px;color:var(--muted);text-align:center;min-height:18px}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.pfnote{font-size:13px;background:var(--pf-soft);border-radius:12px;padding:10px 12px;color:var(--ink)}
.pfnote b{color:var(--pf)}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--navy);color:var(--navy-ink);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer .t{font-family:var(--display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.timer .l{font-size:12px;opacity:.85}
.timer button{font:700 13px var(--body);border-radius:9px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;padding:7px 11px;cursor:pointer}
.timer.done{background:var(--ok)}
.sec{margin:20px 0 8px;font-family:var(--display);font-size:22px}
.prog{display:grid;gap:8px}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center}
.prow .pn{font-weight:700;font-size:14px;min-width:0}
.prow .pv{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prow .pv b{color:var(--ink)}
.prow svg{width:110px;height:36px;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
table.rides{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.rides th,table.rides td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
table.rides th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 8px}
.rules{display:grid;gap:8px}
.rules details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.rules summary{padding:10px 12px;font-weight:700;cursor:pointer}
.rules .rb{padding:0 12px 12px;font-size:14px}
.rules ul{margin:0;padding-left:18px;display:grid;gap:4px}
.linkbtn{background:none;border:0;color:var(--muted);font:600 12px var(--body);text-decoration:underline;cursor:pointer;padding:0}
.posture{display:grid;gap:8px;margin-bottom:10px}
.fig{width:100%;max-width:380px;height:auto;max-height:260px;display:block;margin:0 auto;background:var(--figbg);border-radius:10px}
.fig line{stroke-linecap:round}
.fig .bs{stroke:var(--fig)} .fig .bsf{fill:var(--fig)}
.fig .gs{stroke:var(--ghost)} .fig .gsf{fill:var(--ghost)}
.fig .ghost{opacity:.45} .fig .far{opacity:.5}
.fig .eq{stroke:var(--equip)} .fig .eqf{fill:var(--equip)} .fig .eqs{fill:var(--equip);opacity:.35} .fig .eqd{fill:var(--fig)}
.fig .cab{stroke:var(--equip);stroke-width:1.5;stroke-dasharray:3 2} .fig .band{stroke:var(--pf);stroke-width:2.5}
.fig .floor{stroke:var(--equip);stroke-width:1.5}
.fig .arw{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3} .fig .arwh{fill:var(--accent)}
.fig .pt circle{fill:var(--accent);stroke:var(--figbg);stroke-width:1.5} .fig .ptpf circle{fill:var(--pf)}
.fig .pt text{fill:#fff;font:700 8px var(--body)}
.fig .vlab,.feet .vlab{fill:var(--muted);font:600 7px var(--body)}
.leg{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.leg span{display:inline-block}
.lg1,.lg2{width:14px;height:5px;border-radius:3px;background:var(--fig)} .lg2{background:var(--ghost);opacity:.5;margin-left:6px}
.lg3{color:var(--accent);font-weight:700;margin-left:6px}
.pgrid{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.pgrid:has(> ol:only-child){grid-template-columns:1fr}
.feetbox{width:96px;text-align:center}
.feet{width:90px;height:100px;display:block;margin:0 auto}
.feet .ft{fill:var(--fig)} .feet .ftb{opacity:.45} .feet .eqs{fill:var(--equip);opacity:.35} .feet .ms{stroke:var(--accent);stroke-width:1.5}
.ftl{font-size:11px;color:var(--muted);line-height:1.25}
ol.pts{margin:0;padding-left:0;list-style:none;counter-reset:p;display:grid;gap:5px;font-size:14px;min-width:0}
ol.pts li{counter-increment:p;display:grid;grid-template-columns:20px 1fr;gap:6px}
ol.pts li::before{content:counter(p);width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font:700 11px var(--body);display:grid;place-items:center;margin-top:1px}
ol.pts li.pf::before{background:var(--pf)}
.stepsh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0}
.setup{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lvls label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.plan{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.plan th,.plan td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.plan th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.plan tr.hard td{background:var(--accent-soft)}
.plan td b{font-family:var(--display);font-size:16px}
.guide{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--navy);color:var(--navy-ink);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:6px}
.guide.hard{background:var(--accent)}
.guide .gtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.guide .gph{font-family:var(--display);font-size:26px;font-weight:800;line-height:1}
.guide .gt{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.guide .gd{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.guide .gd b{font-size:18px}
.guide .gn{font-size:12px;opacity:.85}
.guide .gb{display:flex;gap:6px}
.guide button{font:700 13px var(--body);border-radius:9px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;padding:7px 12px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
@media (max-width:380px){nav.days button b{font-size:15px}.setrow{grid-template-columns:44px 1fr 1fr 40px}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><small>Gym · bici · suelo pélvico</small>Mi rutina</div>
    <div class="sync" id="sync">Cargando…</div>
  </header>
  <nav class="days" id="days" aria-label="Días de la semana"></nav>
  <main id="view"></main>
  <p style="text-align:center;margin:24px 0 8px"><a href="instructor.html" style="color:var(--muted);font-weight:600">Versión para el instructor →</a></p>
</div>
<div class="guide" id="guide" hidden>
  <div class="gtop"><div class="gph" id="gPh">Calentar</div><div class="gt" id="gT">0:00</div></div>
  <div class="gd"><span>Nivel <b id="gLv">5</b></span><span><b id="gRpm">85–90</b> rpm</span><span>Pulso <b id="gFc">110–125</b></span></div>
  <div class="gtop"><div class="gn" id="gNext">Sigue: …</div><div class="gb"><button type="button" id="gPause">Pausa</button><button type="button" id="gStop">Terminar</button></div></div>
</div>
<div class="timer" id="timer" hidden>
  <div><div class="l" id="timerLabel">Descanso</div><div class="t" id="timerT">0:00</div></div>
  <div style="display:flex;gap:6px"><button id="tPlus" type="button">+15 s</button><button id="tStop" type="button">Listo</button></div>
</div>

<script>
const YT = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q + " técnica correcta");
// t: w = peso+reps, bw = solo reps, s = segundos, chk = marcar hecho
const EX = {
 sq_smith:{n:"Sentadilla en máquina Smith",sets:4,reps:"8",rest:120,t:"w",ini:"barra + 20 kg",kg:20,inc:2.5,
  how:["Pies un poco adelante de la barra, al ancho de hombros, puntas levemente hacia afuera.","Bajá hasta que los muslos queden paralelos al piso; las rodillas siguen la dirección de los pies.","Pecho arriba y mirada al frente. Exhalá al subir empujando con todo el pie."],
  err:"Levantar los talones o dejar que las rodillas se junten al subir.",q:"sentadilla en máquina smith"},
 leg_press:{n:"Prensa de piernas 45°",sets:3,reps:"10",rest:90,t:"w",ini:"80–100 kg (sin el carro)",kg:80,inc:5,
  how:["Espalda baja y glúteos pegados al respaldo todo el tiempo.","Pies a media plataforma, al ancho de cadera.","Bajá hasta que las rodillas formen 90° y empujá sin bloquear las rodillas arriba."],
  err:"Bajar tanto que la cadera se despega del asiento.",q:"prensa de piernas 45 grados"},
 rdl:{n:"Peso muerto rumano con mancuernas",sets:3,reps:"10",rest:90,t:"w",ini:"14–16 kg por mano",kg:14,inc:2,
  how:["Rodillas apenas dobladas y fijas durante todo el movimiento.","Llevá la cadera hacia atrás deslizando las mancuernas pegadas a los muslos.","Bajá hasta media espinilla con la espalda recta y subí apretando glúteos."],
  err:"Redondear la espalda para bajar más.",q:"peso muerto rumano con mancuernas"},
 lunge:{n:"Zancada con mancuernas",sets:3,reps:"10 por pierna",rest:90,t:"w",ini:"8–10 kg por mano",kg:8,inc:2,
  how:["Paso largo al frente, torso derecho.","Bajá en vertical hasta que la rodilla de atrás casi toque el piso.","Rodilla de adelante sobre el tobillo; empujá con el talón para volver."],
  err:"Inclinar el torso hacia adelante o que la rodilla pase mucho la punta del pie.",q:"zancada con mancuernas"},
 leg_curl:{n:"Curl femoral acostado",sets:3,reps:"12",rest:60,t:"w",ini:"25–30 kg",kg:25,inc:2.5,
  how:["Rodillas justo afuera del borde del banco, rodillo sobre los tobillos.","Subí controlado hasta 90° o más.","Bajá en 3 segundos con la cadera pegada al banco."],
  err:"Levantar la cadera para ayudarte.",q:"curl femoral acostado"},
 calf:{n:"Pantorrilla en máquina",sets:3,reps:"15",rest:60,t:"w",ini:"40–50 kg",kg:40,inc:5,
  how:["Punta de los pies en el borde del escalón.","Subí lo más alto posible y pausá 1 segundo.","Bajá lento hasta sentir el estiramiento."],
  err:"Rebotar abajo sin pausa.",q:"elevación de talones en máquina"},
 bridge_pf:{n:"Puente de glúteo + Kegel",sets:3,reps:"12",rest:45,t:"bw",pf:true,ini:"peso corporal",
  how:["Boca arriba, rodillas dobladas, pies cerca de los glúteos.","Subí la cadera hasta formar una línea rodillas–cadera–hombros.","Arriba sostené 3 s apretando glúteos y subiendo el suelo pélvico. Bajá soltando todo."],
  err:"Arquear la espalda baja en vez de usar el glúteo.",q:"puente de glúteo"},

// ---------- almacenamiento ----------
const S = {logs:{}, rides:{}, mode:"local", db:null};
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function setSync(t){document.getElementById("sync").textContent=t}
async function initStore(){
  S.logs = LS.get("rf_logs",{}); S.rides = LS.get("rf_rides",{});
  setSync("Guardado en este teléfono");
  render();
  let db=null;
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null }catch(e){ db=null }
  if(!db) return;
  S.db=db; S.mode="db"; setSync("Sincronizando…");
  db.collection("logs").onSnapshot(snap=>{
    const o={}; snap.docs.forEach(d=>{o[d.id]=d.data()}); S.logs=o; setSync("Guardado en la nube ✓"); refreshKeepInputs();
  },()=>{S.mode="local"; setSync("Guardado en este teléfono")});
  db.doc("settings/bike").get().then(d=>{if(d.exists){const v=d.data();if(v.suave)BIKE.suave=v.suave;if(v.fuerte)BIKE.fuerte=v.fuerte;LS.set("rf_bike",BIKE);if(!dirty)render()}}).catch(()=>{});
  db.collection("rides").onSnapshot(snap=>{
    const o={}; snap.docs.forEach(d=>{o[d.id]=d.data()}); S.rides=o; if(cur==="prog") render();
  },()=>{});
}
async function saveDoc(col,id,data){
  if(col==="logs") S.logs[id]=data; else S.rides[id]=data;
  LS.set("rf_logs",S.logs); LS.set("rf_rides",S.rides);
  if(S.mode==="db"&&S.db){
    try{ await S.db.collection(col).doc(id).set(data); return "nube" }
    catch(e){ if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*700)); try{await S.db.collection(col).doc(id).set(data);return "nube"}catch(e2){} } return "local" }
  }
  return "local";
}
async function delDoc(col,id){
  if(col==="rides"){delete S.rides[id]; LS.set("rf_rides",S.rides)}
  if(S.mode==="db"&&S.db){try{await S.db.collection(col).doc(id).delete()}catch(e){}}
}

// ---------- dibujos de postura ----------
const LEN={T:40,UA:21,FA:19,TH:30,SH:30,FT:10,NK:10};
const dv=(a,l)=>[Math.cos(a*Math.PI/180)*l,-Math.sin(a*Math.PI/180)*l];
const vadd=(p,v)=>[p[0]+v[0],p[1]+v[1]], vsub=(p,v)=>[p[0]-v[0],p[1]-v[1]];
const STD={sh:-90,th:-90,to:90,ft:0};
function solveS(P){const J={};
  if(P.ankle){J.ankle=P.ankle;J.knee=vsub(J.ankle,dv(P.sh,LEN.SH));J.hip=vsub(J.knee,dv(P.th,LEN.TH));}
  else{J.hip=P.hip;J.knee=vadd(J.hip,dv(P.th,LEN.TH));J.ankle=vadd(J.knee,dv(P.sh,LEN.SH));}
  J.toe=vadd(J.ankle,dv(P.ft??0,LEN.FT));J.sho=vadd(J.hip,dv(P.to,LEN.T));
  J.head=vadd(vadd(J.sho,dv(P.to,LEN.NK)),[P.hdx||0,0]);
  J.elb=vadd(J.sho,dv(P.ua,LEN.UA));J.hand=vadd(J.elb,dv(P.fa,LEN.FA));
  if(P.th2!=null){J.knee2=vadd(J.hip,dv(P.th2,LEN.TH));J.ankle2=vadd(J.knee2,dv(P.sh2,LEN.SH));J.toe2=vadd(J.ankle2,dv(P.ft2??0,LEN.FT));}
  if(P.ua2!=null){J.elb2=vadd(J.sho,dv(P.ua2,LEN.UA));J.hand2=vadd(J.elb2,dv(P.fa2,LEN.FA));}
  J.mid=[(J.hip[0]+J.sho[0])/2,(J.hip[1]+J.sho[1])/2];return J;}
function solveF(P){const J={},cx=100,hy=P.seated?96:88;
  J.hip=[cx,hy];J.sho=[cx,hy-40];J.mid=[cx,hy-20];J.head=[cx,hy-52];J.hipR=[cx+7,hy];J.hipL=[cx-7,hy];J.shoR=[cx+14,hy-40];J.shoL=[cx-14,hy-40];
  J.elbR=vadd(J.shoR,dv(P.ua,LEN.UA));J.handR=vadd(J.elbR,dv(P.fa,LEN.FA));J.elbL=vadd(J.shoL,dv(180-P.ua,LEN.UA));J.handL=vadd(J.elbL,dv(180-P.fa,LEN.FA));
  if(P.seated){J.kneeR=[cx+13,hy+10];J.kneeL=[cx-13,hy+10];J.ankR=[cx+14,146];J.ankL=[cx-14,146];}
  else{const st=P.st||9;J.ankR=[cx+st,146];J.ankL=[cx-st,146];J.kneeR=[(J.hipR[0]+J.ankR[0])/2,(hy+146)/2];J.kneeL=[(J.hipL[0]+J.ankL[0])/2,(hy+146)/2];}
  J.elb=J.elbR;J.hand=J.handR;return J;}
function ref(r,J,G){ if(typeof r==="string"){ if(r.startsWith("g:")) return (G||J)[r.slice(2)]; return J[r]; }
  if(typeof r[0]==="string"){const b=ref(r[0],J,G);return [b[0]+(r[1]||0),b[1]+(r[2]||0)]} return r;}
const P2=p=>p[0].toFixed(1)+" "+p[1].toFixed(1);
function seg(a,b,w,cls){return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke-width="${w}" class="${cls}"/>`}
function bodyS(J,cls){let s="";
  if(J.knee2) s+=`<g class="far">${seg(J.hip,J.knee2,6.5,cls)}${seg(J.knee2,J.ankle2,5.5,cls)}${seg(J.ankle2,J.toe2,4,cls)}</g>`;
  if(J.elb2) s+=`<g class="far">${seg(J.sho,J.elb2,5.5,cls)}${seg(J.elb2,J.hand2,4.5,cls)}</g>`;
  s+=seg(J.hip,J.sho,10,cls)+seg(J.sho,J.head,4,cls)+`<circle cx="${J.head[0].toFixed(1)}" cy="${J.head[1].toFixed(1)}" r="7" class="${cls}f"/>`;
  s+=seg(J.hip,J.knee,7,cls)+seg(J.knee,J.ankle,6,cls)+seg(J.ankle,J.toe,4.5,cls)+seg(J.sho,J.elb,6,cls)+seg(J.elb,J.hand,5,cls);return s;}
function bodyF(J,cls){let s="";
  s+=`<path d="M${P2(J.shoL)} L${P2(J.shoR)} L${P2(J.hipR)} L${P2(J.hipL)} Z" class="${cls}f" />`;
  s+=seg(J.hipR,J.kneeR,7,cls)+seg(J.kneeR,J.ankR,6,cls)+seg(J.hipL,J.kneeL,7,cls)+seg(J.kneeL,J.ankL,6,cls);
  s+=seg(J.shoR,J.elbR,6,cls)+seg(J.elbR,J.handR,5,cls)+seg(J.shoL,J.elbL,6,cls)+seg(J.elbL,J.handL,5,cls);
  s+=seg(J.sho,[J.head[0],J.head[1]+6],4,cls)+`<circle cx="${J.head[0]}" cy="${J.head[1]}" r="7.5" class="${cls}f"/>`;return s;}
function equip(eq,J,G){return (eq||[]).map(e=>{
  if(e.l){const a=ref(e.l[0],J,G),b=ref(e.l[1],J,G);return seg(a,b,e.w||3,"eq")}
  if(e.r){const o=ref(e.r[0],J,G);return `<rect x="${o[0].toFixed(1)}" y="${o[1].toFixed(1)}" width="${e.r[1]}" height="${e.r[2]}" rx="2" class="${e.soft?"eqs":"eqf"}"/>`}
  if(e.c){const o=ref(e.c[0],J,G);return `<circle cx="${o[0].toFixed(1)}" cy="${o[1].toFixed(1)}" r="${e.c[1]}" class="eqf"/>`}
  if(e.cab){const a=ref(e.cab[0],J,G),b=ref(e.cab[1],J,G);return `<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0]}" y2="${b[1]}" class="cab"/><circle cx="${b[0]}" cy="${b[1]}" r="4" class="eqf"/>`}

}
function lastFor(id,beforeDate){const h=history(id).filter(x=>!beforeDate||x.date<beforeDate);return h.length?h[h.length-1]:null}
function suggest(id){
  const e=EX[id], last=lastFor(id,selDate);
  if(e.t!=="w") return null;
  if(!last) return {kg:e.kg,txt:"Inicio: "+e.ini,cls:"start"};
  const done=last.sets.filter(s=>s&&s.kg>0);
  if(!done.length) return {kg:e.kg,txt:"Inicio: "+e.ini,cls:"start"};
  const top=Math.max(...done.map(s=>s.kg));
  const tgt=targetReps(e.reps);
  const allHit=last.sets.length>=e.sets && last.sets.every(s=>s&&s.r>=tgt);
  if(allHit) return {kg:+(top+e.inc).toFixed(1),txt:"Subí a "+(+(top+e.inc).toFixed(1))+" kg",cls:"up",last:top};
  return {kg:top,txt:"Repetí "+top+" kg",cls:"",last:top};
}

const spd=r=>(r.km/(r.min/60)).toFixed(1);
function spark(v){
  const W=110,H=36,p=4; if(v.length<2) v=[v[0],v[0]];
  const mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1;
  const pts=v.map((y,i)=>[p+i*(W-2*p)/(v.length-1),H-p-(y-mn)/rg*(H-2*p)]);
  const d=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d} L${last[0].toFixed(1)} ${H-p} L${p} ${H-p} Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="var(--accent)"/></svg>`;
}

let G=null;
const gEl=()=>document.getElementById("guide");
function beep(n){try{if(!G||!G.ac)return;for(let i=0;i<n;i++){const o=G.ac.createOscillator(),g=G.ac.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(G.ac.destination);const t=G.ac.currentTime+i*.25;o.start(t);o.stop(t+.15)}}catch(e){}}
function gDraw(){const p=G.plan[G.i],nx=G.plan[G.i+1];const e=gEl();e.classList.toggle("hard",p.hard);
  document.getElementById("gPh").textContent=p.ph;document.getElementById("gT").textContent=mmss(G.left);
  document.getElementById("gLv").textContent=lv(p.kind);document.getElementById("gRpm").textContent=p.rpm;document.getElementById("gFc").textContent=p.fc;
  document.getElementById("gNext").textContent=nx?("Sigue: "+nx.ph+" · nivel "+lv(nx.kind)):"Último tramo";}
function gStart(k){
  gStop();
  G={plan:buildPlan(k),i:0,left:0,paused:false,ac:null,lock:null};G.left=G.plan[0].sec;
  try{G.ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>{if(G)G.lock=l}).catch(()=>{})}catch(e){}
  document.getElementById("timer").hidden=true; gEl().hidden=false; beep(1); gDraw();
  G.int=setInterval(()=>{if(G.paused)return;G.left--;
    if(G.left<=3&&G.left>0)beep(1);
    if(G.left<=0){G.i++; if(G.i>=G.plan.length){beep(3);document.getElementById("gPh").textContent="¡Sesión terminada!";clearInterval(G.int);document.getElementById("gT").textContent="0:00";return}
      G.left=G.plan[G.i].sec;beep(2)}
    gDraw()},1000);
}
function gStop(){if(G){clearInterval(G.int);try{G.lock&&G.lock.release()}catch(e){}try{G.ac&&G.ac.close()}catch(e){}}G=null;const e=gEl();if(e)e.hidden=true}
document.getElementById("gPause").onclick=()=>{if(!G)return;G.paused=!G.paused;document.getElementById("gPause").textContent=G.paused?"Seguir":"Pausa"};
document.getElementById("gStop").onclick=gStop;
async function saveBike(){LS.set("rf_bike",BIKE);if(S.mode==="db"&&S.db){try{await S.db.collection("settings").doc("bike").set({suave:+BIKE.suave,fuerte:+BIKE.fuerte})}catch(e){}}}

// ---------- temporizador ----------
let tLeft=0,tInt=null;
const tEl=document.getElementById("timer"),tT=document.getElementById("timerT"),tL=document.getElementById("timerLabel");
function drawT(){tT.textContent=Math.floor(tLeft/60)+":"+String(tLeft%60).padStart(2,"0")}
function startTimer(sec,name){clearInterval(tInt);tLeft=sec;tEl.hidden=false;tEl.classList.remove("done");tL.textContent="Descanso · "+name;drawT();
  tInt=setInterval(()=>{tLeft--; if(tLeft<=0){tLeft=0;clearInterval(tInt);tEl.classList.add("done");tL.textContent="¡A la siguiente serie!";} drawT()},1000)}
document.getElementById("tPlus").onclick=()=>{tLeft+=15;if(tEl.classList.contains("done")){startTimer(tLeft,"extra")}drawT()};
document.getElementById("tStop").onclick=()=>{clearInterval(tInt);tEl.hidden=true};

initStore();
</script>
